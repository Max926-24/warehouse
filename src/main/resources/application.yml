spring:
  application:
    name: warehouse

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/warehouse
    username: postgres
    password: postgres

  # Liquibase: схема БД создаётся миграциями из db/changelog
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  jpa:
    hibernate:
      # validate: схему создаёт Liquibase, Hibernate только проверяет,
      # что сущности совпадают с таблицами (и падает при расхождении)
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

logging:
  level:
    root: info
