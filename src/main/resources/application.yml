spring:
  application:
    name: warehouse

  # Секреты (JWT-ключ) лежат в отдельном файле secret.properties в корне проекта.
  # Этот файл в .gitignore и на GitHub не попадает.
  config:
    import: optional:file:./secret.properties

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/warehouse
    username: postgres
    password: postgres

  # Liquibase: схема БД создаётся миграциями из db/changelog
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  jpa:
    hibernate:
      # validate: схему создаёт Liquibase, Hibernate только проверяет,
      # что сущности совпадают с таблицами (и падает при расхождении)
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

logging:
  level:
    root: info

jwt:
  # сам ключ берётся из secret.properties (переменная JWT_SECRET)
  secret: ${JWT_SECRET}
  expiration-minutes: 60
