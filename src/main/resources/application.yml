spring:
  application:
    name: warehouse

  datasource:
    driver-class-name: org.postgresql.Driver
    # TODO: подставьте реальные host/port/имя базы из вашего docker-контейнера
    url: jdbc:postgresql://localhost:5432/warehouse
    username: postgres
    password: 123

  jpa:
    hibernate:
      # update: Hibernate сам создаёт/дополняет таблицы по сущностям.
      # Удобно для обучения; в "боевом" проекте так делать не стоит -
      # там для этого используют Liquibase/Flyway (как в g_74_shop).
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

logging:
  level:
    root: info
