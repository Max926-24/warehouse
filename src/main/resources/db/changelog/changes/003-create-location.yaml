databaseChangeLog:
  - changeSet:
      id: 003-create-location
      author: maxim
      changes:
        - createTable:
            tableName: location
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: block
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: shelf
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
