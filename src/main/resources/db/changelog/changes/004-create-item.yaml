databaseChangeLog:
  - changeSet:
      id: 004-create-item
      author: maxim
      changes:
        - createTable:
            tableName: item
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: quantity
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: price
                  type: NUMERIC(10,2)
              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              # внешний ключ: товар -> категория
              - column:
                  name: category_id
                  type: BIGINT
                  constraints:
                    foreignKeyName: fk_item_category
                    references: category(id)
              # внешний ключ: товар -> место хранения
              - column:
                  name: location_id
                  type: BIGINT
                  constraints:
                    foreignKeyName: fk_item_location
                    references: location(id)
