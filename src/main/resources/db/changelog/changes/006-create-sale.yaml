databaseChangeLog:
  - changeSet:
      id: 006-create-sale
      author: maxim
      changes:
        - createTable:
            tableName: sale
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: item_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_sale_item
                    references: item(id)
              - column:
                  name: quantity
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: sale_date
                  type: TIMESTAMP
                  constraints:
                    nullable: false
