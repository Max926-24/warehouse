databaseChangeLog:
  - changeSet:
      id: 005-create-delivery
      author: maxim
      changes:
        - createTable:
            tableName: delivery
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: item_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_delivery_item
                    references: item(id)
              - column:
                  name: supplier_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_delivery_supplier
                    references: supplier(id)
              - column:
                  name: quantity
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: price_per_unit
                  type: NUMERIC(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: delivery_date
                  type: TIMESTAMP
                  constraints:
                    nullable: false
